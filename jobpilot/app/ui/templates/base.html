<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobPilot v2{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/alpine.min.js" defer></script>
</head>
<body x-data="globalApp()" @keydown.window="handleShortcuts($event)">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="/" class="logo-badge">
        <div class="logo-icon">J</div>
        <span>JobPilot <span style="font-size:0.75rem; color:#60a5fa; font-weight:600;">v2.0</span></span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a href="/" class="nav-link {% if active_page == 'today' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Today</span>
      </a>
      <a href="/discover" class="nav-link {% if active_page == 'discover' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover Jobs</span>
      </a>
      <a href="/pipeline" class="nav-link {% if active_page == 'pipeline' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
        <span>Pipeline Board</span>
      </a>
      <a href="/companies" class="nav-link {% if active_page == 'companies' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
        <span>Companies</span>
      </a>
      <a href="/outbox" class="nav-link {% if active_page == 'outbox' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        <span>Outbox & Sent</span>
      </a>
      <a href="/followups" class="nav-link {% if active_page == 'followups' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Follow-ups</span>
      </a>
      <a href="/sources" class="nav-link {% if active_page == 'sources' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>Sources & Runs</span>
      </a>
      <a href="/answers" class="nav-link {% if active_page == 'answers' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile & Answers</span>
      </a>
      <a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        <span>Settings & Health</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <span>SSE Stream</span>
        <span style="display:inline-flex; align-items:center; gap:0.35rem; color:#34d399; font-weight:600;">
          <span style="width:8px; height:8px; border-radius:50%; background:#10b981; display:inline-block;"></span>
          LIVE
        </span>
      </div>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="main-wrapper">
    <header class="top-bar">
      <h1 class="top-bar-title">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="top-bar-actions">
        <input type="text" id="global-search" class="input-text" placeholder="Search jobs, skills, companies... (Press /)" style="width: 320px;">
        <button class="btn btn-secondary btn-sm" onclick="location.href='/sources'">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          Run Discovery
        </button>
      </div>
    </header>

    <main class="content-area">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    function globalApp() {
      return {
        sseConnected: false,
        init() {
          this.initSSE();
        },
        initSSE() {
          const evtSource = new EventSource("/api/events");
          evtSource.onopen = () => { this.sseConnected = true; };
          evtSource.onerror = () => { this.sseConnected = false; };
          evtSource.addEventListener("job_saved", (e) => {
            const data = JSON.parse(e.data);
            console.log("New job discovered:", data);
          });
          evtSource.addEventListener("send_batch_complete", (e) => {
            console.log("Send batch completed:", e.data);
          });
        },
        handleShortcuts(e) {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === '/') {
            e.preventDefault();
            document.getElementById('global-search')?.focus();
          }
        }
      }
    }
  </script>
</body>
</html>
